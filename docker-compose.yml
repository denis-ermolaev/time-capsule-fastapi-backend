services:
  # 1. PostgreSQL ----
  db:
    profiles: ["main"]
    image: postgres:16.2-alpine3.19
    volumes:
      - postgres_data_time_capsule:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  # 2. FastAPI-application ----
  web:
    profiles: ["main"]
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
  # 3. Тестовая база данных ----
  test_db:
    profiles: ["test"]
    image: postgres:16.2-alpine3.19
    environment:
      - POSTGRES_DB=test_app
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs: /var/lib/postgresql/data
  # 4. Тестовое окружение ----
  test:
    profiles: ["test"]
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      test_db:
        condition: service_healthy
    environment:
      - DB_HOST=test_db
      - DB_PORT=5432
      - DB_NAME=test_app
      - DB_USER=test_user
      - DB_PASSWORD=test_pass



volumes:
  postgres_data_time_capsule:
