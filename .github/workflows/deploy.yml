name: CI/CD

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations
        run: >
          docker compose -f docker-compose.test.yml run --rm
          -e SECRET_KEY=ci-test-secret-key-min-32-chars-long!!
          test uv run --no-sync alembic upgrade head

      - name: Run tests
        run: >
          docker compose -f docker-compose.test.yml run --rm
          -e SECRET_KEY=ci-test-secret-key-min-32-chars-long!!
          test uv run --no-sync pytest

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: >-
            docker-compose.prod.yml,
            Dockerfile,
            .dockerignore,
            pyproject.toml,
            uv.lock,
            alembic.ini,
            src/,
            migrations/
          target: /opt/time-capsule

      - name: Create .env and start containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/time-capsule || exit 1

            # Создаём .env из секретов
            cat > .env << 'ENVEOF'
            ${{ secrets.SERVER_ENV }}
            ENVEOF

            # Caddyfile
            cat > Caddyfile << 'CADDYEOF'
            ${{ secrets.CADDYFILE }}
            CADDYEOF

            # Сборка и запуск
            docker compose -f docker-compose.prod.yml up --build -d

            # Проверка через 5 секунд
            sleep 5
            docker compose -f docker-compose.prod.yml ps
