services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-api}
      POSTGRES_USER: ${DB_USER:-api}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    volumes:
      - .:/app
    command: >
      sh -c "uv run alembic upgrade head && exec uv run uvicorn src.app:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
